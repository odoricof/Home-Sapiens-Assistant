name: Bump Version & Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Tipo di bump (patch, minor, major)'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major
      prerelease:
        description: 'Pre-release?'
        required: false
        default: 'stable'
        type: choice
        options:
          - 'stable'
          - 'beta'

jobs:
  bump-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: 'main'

      - name: Leggi versione attuale
        id: current
        run: echo "VERSION=$(jq -r '.version' custom_components/domo/manifest.json)" >> $GITHUB_OUTPUT

      - name: Calcola nuova versione (formato HACS: 1.1.1b1)
        id: new
        run: |
          CURRENT=${{ steps.current.outputs.VERSION }}
          BUMP=${{ github.event.inputs.bump }}
          PRERELEASE=${{ github.event.inputs.prerelease }}
          
          # Estrai versione base (senza suffisso bN)
          BASE_VERSION=$(echo $CURRENT | sed 's/b[0-9]*$//')
          MAJOR=$(echo $BASE_VERSION | cut -d. -f1)
          MINOR=$(echo $BASE_VERSION | cut -d. -f2)
          PATCH=$(echo $BASE_VERSION | cut -d. -f3)
          
          # Calcola nuova versione base
          if [ "$BUMP" = "major" ]; then
            NEW_MAJOR=$((MAJOR + 1))
            NEW_BASE="$NEW_MAJOR.0.0"
          elif [ "$BUMP" = "minor" ]; then
            NEW_MINOR=$((MINOR + 1))
            NEW_BASE="$MAJOR.$NEW_MINOR.0"
          else
            NEW_PATCH=$((PATCH + 1))
            NEW_BASE="$MAJOR.$MINOR.$NEW_PATCH"
          fi
          
          # Aggiungi suffisso beta se necessario
          if [ "$PRERELEASE" = "stable" ]; then
            NEW_VERSION="$NEW_BASE"
          else
            # Estrai numero beta attuale (es. da 1.1.1b2 prendo 2)
            CURRENT_BETA_NUM=$(echo $CURRENT | grep -oE 'b[0-9]+$' | sed 's/b//')
            if [ -z "$CURRENT_BETA_NUM" ] || [ "$PRERELEASE" = "stable" ]; then
              # Nuova serie beta
              NEW_BETA_NUM=1
            else
              # Incrementa il numero beta
              NEW_BETA_NUM=$((CURRENT_BETA_NUM + 1))
            fi
            NEW_VERSION="$NEW_BASE b$NEW_BETA_NUM" | sed 's/ //g'  # Toglie lo spazio
          fi
          
          echo "VERSION=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "Old: $CURRENT → New: $NEW_VERSION"

      - name: Aggiorna manifest.json
        run: |
          jq '.version = "${{ steps.new.outputs.VERSION }}"' custom_components/domo/manifest.json > tmp.json
          mv tmp.json custom_components/domo/manifest.json

      - name: Aggiorna README.md (se contiene la versione)
        run: |
          if [ -f "README.md" ] && grep -q "Version:" README.md; then
            sed -i "s/^Version: .*/Version: ${{ steps.new.outputs.VERSION }}/" README.md
            echo "README.md aggiornato"
          else
            echo "README.md non contiene 'Version:', salto"
          fi

      - name: Commit delle modifiche
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add custom_components/domo/manifest.json
          git add README.md 2>/dev/null || true
          git commit -m "chore: bump version to ${{ steps.new.outputs.VERSION }} [skip ci]"
          git push origin main

      - name: Crea tag
        run: |
          git tag -a "${{ steps.new.outputs.VERSION }}" -m "Release ${{ steps.new.outputs.VERSION }}"
          git push origin "${{ steps.new.outputs.VERSION }}"

      - name: Crea Release su GitHub
        uses: softprops/action-gh-release@v1
        with:
          tag_name: "${{ steps.new.outputs.VERSION }}"
          name: "${{ steps.new.outputs.VERSION }}"
          generate_release_notes: true
          prerelease: ${{ github.event.inputs.prerelease == 'beta' }}
