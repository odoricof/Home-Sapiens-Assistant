
name: AI Translate README

on:
  push:
    branches: [ main ]
    paths:
      - 'README.md'
  workflow_dispatch:
    inputs:
      target_lang:
        description: 'Target language (es. Italian, French, Spanish)'
        required: false
        default: 'Italian'
        type: string

permissions:
  contents: write

jobs:
  translate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Importante per avere tutti i commit
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Translate to Italian
        uses: FidelusAleksander/ai-translate-action@v1
        id: translate_it
        with:
          text-file: "README.md"
          target-language: "${{ github.event.inputs.target_lang || 'Italian' }}"
          custom-instructions: |
            Keep technical terms like 'Home Assistant', 'HACS', 'ETI/DOMO', 'CAME Domotic', 'Bpt Home Automation' in English.
            Do not translate code blocks, commands, or URLs.
            Preserve the Markdown syntax and badge links exactly as they are.

      - name: Save and commit translation
        run: |
          # Configura git
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Determina il codice lingua (es. 'it' per Italian)
          LANG_CODE="it"
          if [[ "${{ github.event.inputs.target_lang || 'Italian' }}" != "Italian" ]]; then
            LANG_CODE=$(echo "${{ github.event.inputs.target_lang || 'Italian' }}" | cut -c1-2 | tr '[:upper:]' '[:lower:]')
          fi
          
          # Salva il file tradotto
          echo "${{ steps.translate_it.outputs.translated-text }}" > "README.${LANG_CODE}.md"
          
          # Aggiungi e committa
          git add "README.${LANG_CODE}.md"
          
          # Verifica se ci sono cambiamenti prima di committare
          if git diff --staged --quiet; then
            echo "Nessuna modifica da committare"
          else
            git commit -m "docs: update ${{ github.event.inputs.target_lang || 'Italian' }} translation"
            git push
          fi
