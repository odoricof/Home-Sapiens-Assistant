name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Create zip
        run: |
          cd custom_components/domo
          zip -r ../../home-sapiens-assistant.zip ./*
      
      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: home-sapiens-assistant.zip
