name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Create release zip
        run: |
          cd custom_components/domo
          zip -r ../../home-sapiens-assistant.zip ./*
      
      - name: Upload zip to release
        uses: softprops/action-gh-release@v2
        with:
          files: home-sapiens-assistant.zip
          fail_on_unmatched_files: true
